        :root {

            --surface-bg: rgba(8, 8, 24, 0.65);
            --border-color: rgba(0, 255, 255, 0.25);
            --text-color: #f1f5f9;
            --accent-color: #00ffff;
            --accent-glow: rgba(0, 255, 255, 0.45);
            --galaxy-glow-1: rgba(26, 21, 60, 0.5);
            --galaxy-glow-2: rgba(0, 242, 254, 0.2);
            --glow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        body.theme-sepia {
            --bg-color: #f4ecd8;
            --surface-bg: rgba(229, 219, 194, 0.75);
            --border-color: rgba(139, 90, 43, 0.3);
            --text-color: #4a3319;
            --accent-color: #8b5a2b;
            --accent-glow: rgba(139, 90, 43, 0.3);
            --galaxy-glow-1: rgba(210, 180, 140, 0.3);
            --galaxy-glow-2: rgba(139, 90, 43, 0.12);
            --glow-glass: 0 4px 16px 0 rgba(139, 90, 43, 0.1);
        }
        body.theme-light {
            --bg-color: #f1f5f9;
            --surface-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(203, 213, 225, 1);
            --text-color: #0f172a;
            --accent-color: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.3);
            --galaxy-glow-1: rgba(148, 163, 184, 0.2);
            --galaxy-glow-2: rgba(79, 70, 229, 0.08);
            --glow-glass: 0 8px 32px 0 rgba(100, 116, 139, 0.05);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
       
        body, main, div, button, img {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .glass-panel {
            background-color: var(--surface-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 2px; }
        .thinking-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes galaxyRotate {
            0% { transform: translate3d(-50%, -50%, 0) rotate(0deg) scale3d(1, 1, 1); }
            50% { transform: translate3d(-50%, -50%, 0) rotate(180deg) scale3d(1.1, 1.1, 1); }
            100% { transform: translate3d(-50%, -50%, 0) rotate(360deg) scale3d(1, 1, 1); }
        }
        .galaxy-stage {
            position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; z-index: 0;
            transform: translate3d(-50%, -50%, 0); pointer-events: none; will-change: transform;
            animation: galaxyRotate 60s linear infinite;
            background:
                radial-gradient(circle at 50% 50%, var(--galaxy-glow-1) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, var(--galaxy-glow-2) 0%, transparent 60%),
                radial-gradient(background-color, var(--bg-color) 10%, transparent 100%);
            filter: blur(40px);
        }
        @keyframes shootingStar {
            0% { transform: translate3d(0, 0, 0) rotate(45deg) scale(0); opacity: 0; }
            5% { opacity: 1; }
            10% { transform: translate3d(-1500px, 1500px, 0) rotate(45deg) scale(1); opacity: 0; }
            100% { opacity: 0; }
        }
        .shooting-star {
            position: absolute; width: 120px; height: 2px;
            background: linear-gradient(to left, rgba(0, 255, 255, 1), transparent);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 1;
        }
        .star-1 { top: 5%; right: 10%; animation: shootingStar 18s linear infinite 3s; }
        .star-2 { top: 25%; right: -10%; animation: shootingStar 35s linear infinite 15s; }
        .star-3 { top: 10%; right: 5%; animation: shootingStar 45s linear infinite 28s; }
        .stage-container {
            flex: 1; width: 100%; max-width: 1400px; margin: 0 auto;
            display: grid; grid-template-columns: 360px 1fr; gap: 24px; padding: 24px; min-height: 0; z-index: 10;
        }
        aside { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow-y: auto; padding-right: 4px; }
        .panel-card { border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: var(--glow-glass); }
       
        main {
            border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: relative; overflow-y: auto; min-height: 0; box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        @media (max-width: 992px) {
            .stage-container {
                display: flex;
                flex-direction: column;
                overflow-y: auto;
                padding: 16px 12px;
                padding-bottom: 60px;
                gap: 16px;
            }
            main { order: 1; min-height: 55vh; flex: 0 0 auto; width: 100%; border-radius: 16px; padding: 16px; }
            aside { order: 2; overflow: visible; width: 100%; padding-right: 0; }
        }
        .avatar-lens {
            position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
            min-height: 180px; padding: 10px 0; z-index: 5;
        }
        .skin-layer {
            position: absolute; max-height: 220px; max-width: 90%; opacity: 0; z-index: 1; border-radius: 24px;
            will-change: opacity, transform; transform: scale3d(0.95, 0.95, 1); pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .skin-layer > img {
            max-height: 100%; object-fit: contain; border-radius: 24px;
        }
       
        @keyframes corePulse {
            0% { transform: scale3d(1, 1, 1); filter: drop-shadow(0 0 15px var(--accent-color)) drop-shadow(0 0 30px rgba(0, 255, 255, 0.3)); }
            50% { transform: scale3d(1.03, 1.03, 1); filter: drop-shadow(0 0 22px var(--accent-color)) drop-shadow(0 0 45px rgba(0, 255, 255, 0.5)) brightness(1.1); }
            100% { transform: scale3d(1, 1, 1); filter: drop-shadow(0 0 15px var(--accent-color)) drop-shadow(0 0 30px rgba(0, 255, 255, 0.3)); }
        }
       
        .skin-layer.active { opacity: 1; z-index: 2; animation: corePulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; pointer-events: auto;}
        
        @keyframes speakPulse {
            0% { transform: scale3d(1, 1, 1); filter: drop-shadow(0 0 15px var(--accent-color)) brightness(1); }
            50% { transform: scale3d(1.02, 1.02, 1); filter: drop-shadow(0 0 35px var(--accent-color)) brightness(1.15); }
            100% { transform: scale3d(1, 1, 1); filter: drop-shadow(0 0 15px var(--accent-color)) brightness(1); }
        }
        .skin-layer.speaking { animation: speakPulse 2s ease-in-out infinite; pointer-events: auto; z-index: 3;}
        .viseme-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.05s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        .viseme-overlay img {
            max-height: 100%; object-fit: contain; border-radius: 24px;
        }
        .magic-glow-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .magic-glow-hover:hover { box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px var(--accent-glow); color: var(--accent-color); border-color: var(--accent-color); transform: scale(1.05); }
        
        .eq-matrix { display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; margin-bottom: 16px; z-index: 10;}
        .eq-bar { width: 5px; height: 8px; background-color: var(--accent-color); border-radius: 3px; transform: scaleY(1); transform-origin: bottom; will-change: transform; transition: transform 0.05s linear; }
        
        .transcript-deck { width: 100%; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--border-color); padding: 16px; border-radius: 16px; z-index: 10; backdrop-filter: blur(10px); }
        
        header { width: 100%; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 30; border-bottom: 1px solid var(--border-color); }
        .brand-block { display: flex; align-items: center; gap: 14px; }
        .brand-monogram { width: 38px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #00ffff, #4f46e5); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #ffffff; font-size: 1.1rem; }
       
        .hub-controls { display: flex; align-items: center; gap: 14px; }
        .btn-pill-group { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;}
        .btn-pill { background: transparent; border: none; color: var(--text-color); opacity: 0.5; padding: 6px 14px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;}
        .btn-pill.active { background: rgba(255, 255, 255, 0.15); color: var(--accent-color); opacity: 1; }
        
        .status-tag { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; transition: background-color 0.3s ease; }
        .status-dot.active { animation: corePulse 1.5s infinite; }
        footer { width: 100%; padding: 18px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; z-index: 30; border-top: 1px solid var(--border-color); gap: 16px; }
        @media (max-width: 768px) { footer { justify-content: center; } }
        .btn-action-square { width: 46px; height: 44px; font-size: 1.2rem; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-color); cursor: pointer;}
       
        .mic-active { animation: pulse-red 1.5s infinite; color: #ef4444 !important; border-color: #ef4444 !important; }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--accent-color); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--accent-color); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>

    <script>
        // ==========================================
        // SYSTEM CONTROLS & GLOBAL UI MANAGER
        // ==========================================
        window.SystemApp = {
            setTheme: function(theme) {
                document.body.className = `theme-${theme}`;
                document.querySelectorAll('#theme-dark-btn, #theme-sepia-btn, #theme-light-btn').forEach(btn => btn.classList.remove('active'));
                const targetBtn = document.getElementById(`theme-${theme}-btn`);
                if (targetBtn) targetBtn.classList.add('active');
            },
            toggleSkin: function(skinId) {
                document.querySelectorAll('.skin-layer').forEach(el => el.classList.remove('active'));
                const targetSkin = document.getElementById(`skin-${skinId}`);
                if (targetSkin) targetSkin.classList.add('active');
                
                document.querySelectorAll('.btn-pill-group .btn-pill').forEach(btn => btn.classList.remove('active'));
                const targetBtn = document.getElementById(`skin-btn-${skinId}`);
                if (targetBtn) targetBtn.classList.add('active');
            },
            executeVaultCheckout: function() {
                alert("Sovereign Vault Checkout: Tier 1 offline local processing active.");
            },
            forkTimeline: function() {
                alert("Timeline Forked: New sovereign execution path opened.");
            }
        };
        const JAI_CONFIG = { MODEL: "gemini-1.5-flash" };
        const JAI_LEXICON = {
            "core": {
                "aeroscribe": "AeroScribe: To compose code, music, or narrative in a fluid, intuitive manner.",
                "chronoforge": "Chronoforge: To shape historical material into a structured narrative.",
                "mythocode": "Mythocode: A programming approach using ancestral memory and symbolic logic.",
                "omnistack": "OmniStack: Development environment extending beyond traditional front-end boundaries."
            }
        };
        let JAI_LOCAL_DICTIONARY = {};
        fetch('./dictionary.json')
            .then(res => res.json())
            .then(data => {
                JAI_LOCAL_DICTIONARY = data;
                console.log("JAI American Standard English & Lexicon Dictionary loaded:", Object.keys(data).length, "entries.");
            })
            .catch(err => console.warn("Dictionary load notice:", err));
        // ==========================================
        // TIER 1 NEURO-SYMBOLIC OFFLINE ENGINE
        // ==========================================
        function processTier1Offline(prompt) {
            const cleanPrompt = prompt.trim();
            const p = cleanPrompt.toLowerCase();
            // 1. Math.js Calculator Engine
            if (typeof math !== 'undefined' && (/[\d+\-*/^()=]/.test(cleanPrompt) || p.startsWith('calculate') || p.startsWith('math') || p.includes('what is'))) {
                try {
                    let expr = cleanPrompt.replace(/what is|calculate|math|\?/gi, '').trim();
                    if (expr.length > 0 && /^[0-9+\-*/^() .eEsqrtabsincostanlog]+$/i.test(expr)) {
                        const result = math.evaluate(expr);
                        return `Neuro-Symbolic Math Engine: ${expr} = ${result}`;
                    }
                } catch (e) {
                    // Not a valid standalone math expression, continue routing
                }
            }
            // 2. Dictionary & Lexicon Lookup Engine
            const defKeywords = ['define', 'definition of', 'what does', 'meaning of', 'jai lexicon', 'lexicon'];
            for (const keyw of defKeywords) {
                if (p.includes(keyw)) {
                    const targetWord = p.replace(keyw, '').replace(/[\?\.!"]/g, '').trim();
                    if (JAI_LOCAL_DICTIONARY[targetWord]) {
                        return `American Standard English Vault: "${targetWord}" is defined as: ${JAI_LOCAL_DICTIONARY[targetWord]}`;
                    }
                    // Check partial match
                    for (const dictKey in JAI_LOCAL_DICTIONARY) {
                        if (dictKey === targetWord || targetWord.includes(dictKey)) {
                            return `American Standard English Vault: "${dictKey}" is defined as: ${JAI_LOCAL_DICTIONARY[dictKey]}`;
                        }
                    }
                }
            }
            // Direct Lexicon Term Check
            for (const dictKey in JAI_LOCAL_DICTIONARY) {
                if (p === dictKey || p === `what is ${dictKey}` || p === `define ${dictKey}`) {
                    return `JAI Lexicon Entry: "${dictKey}" — ${JAI_LOCAL_DICTIONARY[dictKey]}`;
                }
            }
            // 3. Pan-American History Vault Search (3000 BCE to Present)
            if (typeof JAI_HISTORY_VAULT !== 'undefined') {
                for (const entry of JAI_HISTORY_VAULT) {
                    const subLower = entry.subject.toLowerCase();
                    if (p.includes(subLower) || (entry.tags && entry.tags.some(tag => p.includes(tag)))) {
                        return `Pan-American Sovereign Vault [${entry.region} ${entry.era}]: ${entry.subject} (${entry.type}). ${entry.description}`;
                    }
                }
            }
            // 4. Keyword Router
            if (p.includes('who are you') || p.includes('your name')) {
                return "I am Jai, an OmniStack Digital Assistant and thought-partner, running on a local neuro-symbolic architecture with speech chunking.";
            }
            if (p.includes('creator') || p.includes('who made you')) {
                return "I was created by the sovereign lead engineer of the JaiVerse.";
            }
            return null;
        }
        // ==========================================
        // HARDWARE & PERMISSIONS HANDSHAKE
        // ==========================================
        async function initHardwareSandbox() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    console.log("Hardware Handshake: TTS Engine online.");
                }
            } catch (err) {
                console.warn("Hardware Handshake Notice:", err);
            }
        }
        initHardwareSandbox();
        // ==========================================
        // MAIN DOMCONTENTLOADED WRAPPER
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            let allSystemVoices = [], ttsState = 'idle', currentChunks = [], currentUtterance = null, animationFrameId = null, recognition = null, isRecording = false, isLanguageLocked = false;
            let currentOcularBase64 = null;
            
            const deviceLang = (navigator.language || 'en').split('-')[0];
            const supportedLangs = ['en', 'es', 'hi', 'pt', 'it', 'fr', 'de', 'la', 'zh', 'ja', 'ru', 'ar'];
            let activeLang = supportedLangs.includes(deviceLang) ? deviceLang : 'en';
            const dom = {
                aiPromptInput: document.getElementById('ai-prompt-input'),
                generateAiBtn: document.getElementById('generate-ai-btn'),
                micBtn: document.getElementById('mic-btn'),
                promptSpeakerBtn: document.getElementById('prompt-speaker-btn'),
                ttsInput: document.getElementById('tts-input'),
                playBtn: document.getElementById('play-btn'),
                playIcon: document.getElementById('play-icon'),
                playText: document.getElementById('play-text'),
                stopBtn: document.getElementById('stop-btn'),
                statusDisplay: document.getElementById('tts-status'),
                transcriptLine: document.getElementById('transcript-line'),
                voiceSelect: document.getElementById('voice-select'),
                langSelect: document.getElementById('lang-select'),
                lexiconSelect: document.getElementById('lexicon-select'),
                lexiconInjectBtn: document.getElementById('lexicon-inject-btn'),
                modeSelect: document.getElementById('mode-select'),
                pixarMouth: document.getElementById('pixar-mouth-open'),
                femaleMouth: document.getElementById('female-mouth-open'),
                statusDot: document.getElementById('status-dot'),
                statusText: document.getElementById('status-text'),
                ocularNerveBtn: document.getElementById('ocular-nerve-btn'),
                ocularVideo: document.getElementById('ocular-video-element'),
                ocularCanvas: document.getElementById('ocular-canvas-element')
            };
            if (dom.langSelect) dom.langSelect.value = activeLang;
            // ==========================================
            // OCULAR NERVE CAMERA BASE64 CAPTURE ENGINE
            // ==========================================
            async function triggerOcularNerveBase64Capture() {
                if (!dom.transcriptLine) return;
                dom.transcriptLine.innerText = `"Activating Ocular Nerve visual feed..."`;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    dom.ocularVideo.srcObject = stream;
                    await dom.ocularVideo.play();
                    // Allow camera sensor 300ms to warm up exposure
                    setTimeout(() => {
                        const width = dom.ocularVideo.videoWidth || 640;
                        const height = dom.ocularVideo.videoHeight || 480;
                        dom.ocularCanvas.width = width;
                        dom.ocularCanvas.height = height;
                        const ctx = dom.ocularCanvas.getContext('2d');
                        ctx.drawImage(dom.ocularVideo, 0, 0, width, height);
                        // Capture Base64 JPEG data string
                        currentOcularBase64 = dom.ocularCanvas.toDataURL('image/jpeg', 0.85);
                        
                        // Turn off camera stream light
                        stream.getTracks().forEach(track => track.stop());
                        console.log("Ocular Base64 Image Payload Captured successfully. Length:", currentOcularBase64.length);
                        dom.transcriptLine.innerText = `"Ocular feed captured in Base64 (${width}x${height}). Visual context ready."`;
                        
                        if (dom.aiPromptInput && !dom.aiPromptInput.value) {
                            dom.aiPromptInput.value = "[Visual Base64 Feed Attached] Describe what you see or analyze this frame.";
                        }
                    }, 300);
                } catch (err) {
                    console.error("Ocular Camera Error:", err);
                    dom.transcriptLine.innerText = `"Camera feed unavailable or permission denied."`;
                }
            }
            if (dom.ocularNerveBtn) {
                dom.ocularNerveBtn.addEventListener('click', triggerOcularNerveBase64Capture);
            }
            // ==========================================
            // WAVEFORM VISUALIZER & LIP SYNC
            // ==========================================
            const runVisualizer = (isSpeaking) => {
                const bars = document.querySelectorAll('.eq-bar');
                if (!isSpeaking) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                    bars.forEach(bar => bar.style.transform = 'scaleY(1)');
                    if (dom.pixarMouth) dom.pixarMouth.style.opacity = '0';
                    if (dom.femaleMouth) dom.femaleMouth.style.opacity = '0';
                    return;
                }
                function renderFrame() {
                    const simulatedVolume = Math.random();
                    bars.forEach(bar => {
                        const magnitude = (Math.random() * 1.5) + (simulatedVolume * 1.2) + 1;
                        bar.style.transform = `scaleY(${magnitude})`;
                    });
                    const isMouthOpen = simulatedVolume > 0.45;
                    if (dom.pixarMouth) dom.pixarMouth.style.opacity = isMouthOpen ? '1' : '0';
                    if (dom.femaleMouth) dom.femaleMouth.style.opacity = isMouthOpen ? '1' : '0';
                    animationFrameId = requestAnimationFrame(renderFrame);
                }
                renderFrame();
            };
            const antiGravityLanguageDetect = (text) => {
                if (!text || isLanguageLocked) return;
                if (/[\u0900-\u097F]/.test(text)) dom.langSelect.value = 'hi';
                else if (/[áéíóúñ¿¡]/i.test(text)) dom.langSelect.value = 'es';
                else dom.langSelect.value = 'en';
                
                activeLang = dom.langSelect.value;
                updateVoiceList();
            };
            // ==========================================
            // WEB SPEECH STT RECOGNITION
            // ==========================================
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition && dom.micBtn) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
               
                recognition.onstart = () => {
                    isRecording = true;
                    dom.micBtn.classList.add('mic-active');
                    dom.aiPromptInput.placeholder = "Listening... Speak now.";
                    dom.transcriptLine.innerText = '"Audio channel open. Transcribing..."';
                    runVisualizer(true);
                };
               
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    dom.aiPromptInput.value = dom.aiPromptInput.value ? dom.aiPromptInput.value + " " + transcript : transcript;
                    dom.transcriptLine.innerText = `"${transcript}"`;
                };
               
                recognition.onerror = (event) => {
                    console.error("Speech Error:", event.error);
                    dom.transcriptLine.innerText = '"Microphone error. Check permissions."';
                };
               
                recognition.onend = () => {
                    isRecording = false;
                    dom.micBtn.classList.remove('mic-active');
                    runVisualizer(false);
                    if(!dom.aiPromptInput.value.trim()) {
                        dom.aiPromptInput.placeholder = "Ask Jai (Math, History, Lexicon, Dictionary)...";
                    }
                };
                dom.micBtn.addEventListener('click', () => {
                    if (isRecording) {
                        recognition.stop();
                    } else {
                        recognition.lang = dom.langSelect.value === 'la' ? 'it-IT' : dom.langSelect.value;
                        recognition.start();
                    }
                });
            } else if (dom.micBtn) {
                dom.micBtn.style.display = 'none';
            }
            if (dom.promptSpeakerBtn) {
                dom.promptSpeakerBtn.addEventListener('click', () => {
                    const textToRead = dom.aiPromptInput.value.trim();
                    if (!textToRead) return;
                    dom.ttsInput.value = textToRead;
                    antiGravityLanguageDetect(textToRead);
                    setTimeout(() => dom.playBtn.click(), 200);
                });
            }
            // ==========================================
            // DIGITAL HOUDINI TTS VOICE PRIORITIZATION
            // ==========================================
            function updateVoiceList() {
                if (!window.speechSynthesis) return;
                allSystemVoices = window.speechSynthesis.getVoices();
                if (allSystemVoices.length === 0 || !dom.voiceSelect) return;
               
                let searchPrefix = activeLang === 'la' ? 'it' : (activeLang === 'nah' ? 'es' : activeLang);
                let filteredVoices = allSystemVoices.filter(v => v.lang.startsWith(searchPrefix));
               
                dom.voiceSelect.innerHTML = '';
                if (filteredVoices.length === 0) {
                    dom.voiceSelect.innerHTML = '<option value="">Default System Voice</option>';
                    return;
                }
                let selectedIndex = 0;
                let primaryFound = false;
                filteredVoices.forEach((voice, index) => {
                    const opt = document.createElement('option');
                    opt.value = allSystemVoices.indexOf(voice);
                    const cleanName = voice.name.replace(/Microsoft |Google /g, '');
                    opt.textContent = `${cleanName} (${voice.lang})`;
                   
                    const vName = voice.name.toLowerCase();
                    
                    // ENGLISH VOICE PRIORITY FIX:
                    // Primary 1: Microsoft Dave / David (US Male)
                    // Primary 2: US Female (Zira, Jenny, Aria, US English Female)
                    // Secondary Fallback: British English (Daniel, UK)
                    if (activeLang === 'en' && !primaryFound) {
                        if (vName.includes('dave') || vName.includes('david')) {
                            selectedIndex = index;
                            primaryFound = true;
                        } else if (vName.includes('zira') || vName.includes('jenny') || vName.includes('aria') || (vName.includes('female') && vName.includes('us'))) {
                            selectedIndex = index;
                        } else if (!primaryFound && (vName.includes('daniel') || vName.includes('uk'))) {
                            // Secondary fallback if no US primary found yet
                            selectedIndex = index;
                        }
                    }
                    dom.voiceSelect.appendChild(opt);
                });
               
                dom.voiceSelect.selectedIndex = selectedIndex;
            }
            if (dom.langSelect) {
                dom.langSelect.addEventListener('change', () => {
                    activeLang = dom.langSelect.value;
                    isLanguageLocked = true;
                    if (dom.transcriptLine) dom.transcriptLine.innerText = `"Acoustic profile locked to ${activeLang.toUpperCase()}."`;
                    updateVoiceList();
                });
            }
            updateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = updateVoiceList;
            }
            // ==========================================
            // CHUNKING ENGINE & TTS PROCESSOR
            // ==========================================
            function breakTextIntoChunks(text, max = 220) {
                let cleanText = text.replace(/[*#]/g, '');
                const sentences = cleanText.match(/[^.!?;\n]+[.!?;\n]+/g) || [cleanText];
                let chunks = [], current = "";
                for (let s of sentences) {
                    if ((current + s).length > max) {
                        if (current) chunks.push(current.trim());
                        current = s;
                    } else {
                        current += " " + s;
                    }
                }
                if (current) chunks.push(current.trim());
                return chunks.filter(c => c.length > 2);
            }
            function createUtterance(text) {
                const u = new SpeechSynthesisUtterance(text);
                const voiceIndex = dom.voiceSelect ? dom.voiceSelect.value : "";
               
                if (allSystemVoices.length && voiceIndex !== "") {
                    u.voice = allSystemVoices[voiceIndex];
                }
                u.lang = u.voice ? u.voice.lang : (activeLang === 'la' ? 'it-IT' : (activeLang === 'nah' ? 'es-MX' : activeLang));
                u.rate = parseFloat(document.getElementById('rate').value || 0.96);
                u.pitch = parseFloat(document.getElementById('pitch').value || 1.0);
                u.volume = parseFloat(document.getElementById('volume').value || 1.0);
                return u;
            }
            function updateUIState(state) {
                ttsState = state;
                if (state === 'playing') {
                    dom.playIcon.innerText = "⏸";
                    dom.playText.innerText = "Pause Sync";
                    dom.statusDisplay.innerText = "TRANSMITTING";
                    dom.statusDisplay.className = "text-[10px] font-bold text-teal-400 uppercase animate-pulse";
                    runVisualizer(true);
                } else if (state === 'paused') {
                    dom.playIcon.innerText = "▶";
                    dom.playText.innerText = "Resume Sync";
                    dom.statusDisplay.innerText = "PAUSED";
                    dom.statusDisplay.className = "text-[10px] font-bold text-amber-500 uppercase";
                    runVisualizer(false);
                } else if (state === 'thinking') {
                    dom.statusDisplay.innerHTML = '<div class="thinking-spinner"></div> THINKING';
                    dom.statusDisplay.className = "text-[10px] font-bold text-indigo-400 uppercase flex items-center";
                } else {
                    dom.playIcon.innerText = "▶";
                    dom.playText.innerText = "Initialize";
                    dom.statusDisplay.innerText = "IDLE";
                    dom.statusDisplay.className = "text-[10px] font-bold text-slate-400 uppercase tracking-widest";
                    runVisualizer(false);
                }
            }
            function triggerAvatarLipSync(isSpeaking) {
                const activeAvatar = document.querySelector('.skin-layer.active');
                if (activeAvatar) {
                    activeAvatar.classList.toggle('speaking', isSpeaking);
                }
            }
            function processChunks() {
                if (currentChunks.length === 0) {
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                    return;
                }
               
                const text = currentChunks.shift();
                currentUtterance = createUtterance(text);
               
                currentUtterance.onstart = () => triggerAvatarLipSync(true);
                currentUtterance.onpause = () => triggerAvatarLipSync(false);
                currentUtterance.onresume = () => triggerAvatarLipSync(true);
                currentUtterance.onend = () => {
                    if (ttsState === 'playing') {
                        processChunks();
                    } else {
                        triggerAvatarLipSync(false);
                    }
                };
               
                currentUtterance.onerror = (e) => {
                    console.error("TTS Error:", e);
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                };
                speechSynthesis.speak(currentUtterance);
            }
            if (dom.playBtn) {
                dom.playBtn.addEventListener('click', () => {
                    if (ttsState === 'playing') {
                        speechSynthesis.pause();
                        updateUIState('paused');
                        return;
                    }
                   
                    if (ttsState === 'paused') {
                        speechSynthesis.resume();
                        updateUIState('playing');
                        return;
                    }
                    const text = dom.ttsInput.value.trim();
                    if (!text) return;
                    speechSynthesis.cancel();
                    currentChunks = breakTextIntoChunks(text);
                    if(currentChunks.length === 0) return;
                    updateUIState('playing');
                    processChunks();
                });
            }
            if (dom.stopBtn) {
                dom.stopBtn.addEventListener('click', () => {
                    speechSynthesis.cancel();
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                });
            }
            // ==========================================
            // LEXICON INJECTION & DISPATCH
            // ==========================================
            if (dom.lexiconInjectBtn && dom.lexiconSelect) {
                dom.lexiconInjectBtn.addEventListener('click', () => {
                    const selectedTerm = dom.lexiconSelect.value;
                    if(selectedTerm) {
                        dom.ttsInput.value = dom.ttsInput.value ? dom.ttsInput.value + "\n\n" + selectedTerm : selectedTerm;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Lexicon term injected into acoustic buffer."`;
                       
                        dom.lexiconInjectBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                        dom.lexiconInjectBtn.innerText = "INJECTED ✓";
                        setTimeout(() => {
                            dom.lexiconInjectBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
                            dom.lexiconInjectBtn.innerText = "Inject to Prompter";
                        }, 1500);
                    }
                });
            }
            // Dynamic Offline Fallback Generator
            function generateDynamicOfflineResponse(prompt, mode) {
                let subject = "your query";
                if (window.nlp) {
                    const nouns = window.nlp(prompt).nouns().out('array');
                    if (nouns.length > 0) subject = nouns[0];
                }
                const responses = {
                    "Short & Punchy": `Local Sovereign Engine: Evaluated "${subject}". All parameters valid.`,
                    "Genius-Philosopher": `Pondering "${subject}" through sovereign logic reveals an interconnected structure of local thought.`,
                    "Comedic Roast": `Offline mode active. Asking about "${subject}"? My local logic core is on it!`,
                    "cloud": `Offline Failsafe: Synthesized local context for "${subject}".`
                };
                return responses[mode] || responses.cloud;
            }
            // ==========================================
            // GENERATE BTN: DECOUPLED CLOUD / OFFLINE FIRST
            // ==========================================
            if (dom.generateAiBtn) {
                dom.generateAiBtn.addEventListener('click', async () => {
                    const prompt = dom.aiPromptInput.value.trim();
                    if (!prompt) return;
                    
                    dom.generateAiBtn.disabled = true;
                    runVisualizer(true);
                    const activeMode = dom.modeSelect ? dom.modeSelect.value : "cloud";
                    // 1. TIER 1 LOCAL NEURO-SYMBOLIC ROUTER CHECK
                    const offlineResponse = processTier1Offline(prompt);
                    if (offlineResponse) {
                        dom.ttsInput.value = offlineResponse;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Local Sovereign Vault match found. Routing to TTS."`;
                        antiGravityLanguageDetect(offlineResponse);
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                        setTimeout(() => dom.playBtn.click(), 200);
                        return;
                    }
                    // 2. OFFLINE OR MANUAL LOCAL MODE
                    if (!navigator.onLine || activeMode !== "cloud") {
                        const localResponse = generateDynamicOfflineResponse(prompt, activeMode);
                        dom.ttsInput.value = localResponse;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Offline compute engaged. Bypassing cloud API."`;
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                        setTimeout(() => dom.playBtn.click(), 200);
                        return;
                    }
                    // 3. CLOUD API CALL WITH TIMEOUT FAILSAFE
                    if (dom.transcriptLine) dom.transcriptLine.innerText = `"Consulting Cognitive Core..."`;
                    updateUIState('thinking');
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 6000);
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: prompt,
                                mode: activeMode,
                                model: JAI_CONFIG.MODEL,
                                imageBase64: currentOcularBase64
                            }),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                        const data = await response.json();
                        if (data.text) {
                            dom.ttsInput.value = data.text;
                            antiGravityLanguageDetect(data.text);
                            if (dom.transcriptLine) dom.transcriptLine.innerText = `"Cloud response secured. Synthesizing voice."`;
                            updateUIState('idle');
                            setTimeout(() => dom.playBtn.click(), 200);
                        }
                    } catch (error) {
                        console.warn("Cloud API unreachable or throttled. Routing to local synthesis.", error);
                        const fallbackMsg = generateDynamicOfflineResponse(prompt, "cloud");
                        dom.ttsInput.value = fallbackMsg;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Cloud link offline. Synthesizing local response."`;
                        updateUIState('idle');
                        setTimeout(() => dom.playBtn.click(), 200);
                    } finally {
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                    }
                });
            }
            // Slider values
            ['rate','pitch','volume'].forEach(id => {
                const slider = document.getElementById(id);
                const val = document.getElementById(id + '-val');
                if (slider && val) {
                    slider.addEventListener('input', () => val.textContent = parseFloat(slider.value).toFixed(2));
                }
            });
        });
    </script>
</body>
</html>

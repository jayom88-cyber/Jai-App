        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }

    <script>
        // ==========================================
        // SYSTEM CONTROLS & GLOBAL UI MANAGER

        window.SystemApp = {

        const JAI_CONFIG = { MODEL: "gemini-1.5-flash" };

        const JAI_LEXICON = {
            "core": {
                "aeroscribe": "AeroScribe: To compose code, music, or narrative in a fluid, intuitive manner.",
                "chronoforge": "Chronoforge: To shape historical material into a structured narrative.",
                "mythocode": "Mythocode: A programming approach using ancestral memory and symbolic logic.",
                "omnistack": "OmniStack: Development environment extending beyond traditional front-end boundaries.",
                "digital houdini": "Digital Houdini: Specialized acoustic chunking speech engine."
            }
        };

        let LOCAL_DICTIONARY = {};
        fetch('./dictionary.json')
            .then(res => res.json())
            .then(data => {
                LOCAL_DICTIONARY = data;
                console.log("JAI High-Frequency Local Vault loaded:", Object.keys(data).length, "vocabulary entries.");
            })
            .catch(err => console.warn("Dictionary load notice:", err));

        // ==========================================
        // INITIALIZE BIOMETRIC MODELS (FACE-API)
        // ==========================================
        async function initBiometrics() {
            // Using standard public CDN weights for face-api
            const modelUrl = 'https://justadudewhohacks.github.io/face-api.js/models';
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(modelUrl);
                await faceapi.nets.faceExpressionNet.loadFromUri(modelUrl);
                console.log("Biometric models loaded successfully.");
            } catch (e) { 
                console.warn("Biometrics models pending...", e); 
            }
        }
        initBiometrics();

        // ==========================================
        // TASK 2: 4-TIER HYBRID LOOKUP & FAULT-TOLERANT ROUTER
        // ==========================================
        async function resolveDictionaryQuery(word) {
            const cleanWord = word.toLowerCase().trim();
            if (typeof LOCAL_DICTIONARY !== 'undefined' && LOCAL_DICTIONARY[cleanWord]) {
                return `American Standard English Vault: "${cleanWord}" is defined as: ${LOCAL_DICTIONARY[cleanWord]}`;
            }
            if (typeof LOCAL_DICTIONARY !== 'undefined') {
                for (const dictKey in LOCAL_DICTIONARY) {
                    if (dictKey === cleanWord || cleanWord.includes(dictKey)) {
                        return `Sovereign Vault Entry: "${dictKey}" — ${LOCAL_DICTIONARY[dictKey]}`;
                    }
                }
            }
            if (navigator.onLine) {
                try {
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
                    if (response.ok) {
                        const data = await response.json();
                        const definition = data[0]?.meanings[0]?.definitions[0]?.definition;
                        if (definition) {
                            return `Public Dictionary API: "${cleanWord}" is defined as: ${definition}`;
                        }
                    }
                } catch (e) {
                    console.warn("Public Dictionary API lookup failed. Falling back to NLP.", e);
                }
            }
            if (window.nlp) {
                const doc = window.nlp(cleanWord);
                const root = doc.verbs().toInfinitive().text() || doc.nouns().toSingular().text() || cleanWord;
                return `Local analysis of "${cleanWord}" (root word: "${root}"). Sovereign vault active.`;
            }
            return `Definition for "${cleanWord}" is currently unmapped in the offline vault.`;
        }

        function processTier1Offline(prompt) {
            const cleanPrompt = prompt.trim();
            const p = cleanPrompt.toLowerCase();
            if (typeof math !== 'undefined' && (/[\d+\-*/^()=]/.test(cleanPrompt) || p.startsWith('calculate') || p.startsWith('math') || p.includes('what is'))) {
                try {
                    let expr = cleanPrompt.replace(/what is|calculate|math|\?/gi, '').trim();
                    if (expr.length > 0 && /^[0-9+\-*/^() .eEsqrtabsincostanlog]+$/i.test(expr)) {
                        const result = math.evaluate(expr);
                        return `Neuro-Symbolic Math Engine: ${expr} = ${result}`;
                    }
                } catch (e) {}
            }
            if (typeof JAI_HISTORY_VAULT !== 'undefined') {
                for (const entry of JAI_HISTORY_VAULT) {
                    const subLower = entry.subject.toLowerCase();
                    if (p.includes(subLower) || (entry.tags && entry.tags.some(tag => p.includes(tag)))) {
                        return `Pan-American Sovereign Vault [${entry.region} ${entry.era}]: ${entry.subject} (${entry.type}). ${entry.description}`;
                    }
                }
            }
            if (p.includes('who are you') || p.includes('your name')) {
                return "I am Jai, an OmniStack Digital Assistant and thought-partner, running on a local neuro-symbolic architecture with speech chunking.";
            }
            if (p.includes('creator') || p.includes('who made you')) {
                return "I was created by Lead Engineer Jairo (Jay) Bonilla of the JAI-VERSE.";
            }
            return null;
        }

        async function initHardwareSandbox() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    console.log("Hardware Handshake: TTS Engine online.");
                }
            } catch (err) {
                console.warn("Hardware Handshake Notice:", err);
            }
        }
        initHardwareSandbox();

        // ==========================================
        // MAIN DOMCONTENTLOADED WRAPPER
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            let allSystemVoices = [], ttsState = 'idle', currentChunks = [], currentUtterance = null, animationFrameId = null, recognition = null, isRecording = false, isLanguageLocked = false;
            let currentOcularBase64 = null;
            
            const deviceLang = (navigator.language || 'en').split('-')[0];
            const supportedLangs = ['en', 'es', 'hi', 'pt', 'it', 'fr', 'de', 'la', 'zh', 'ja', 'ru', 'ar'];
            let activeLang = supportedLangs.includes(deviceLang) ? deviceLang : 'en';

            const dom = {
                aiPromptInput: document.getElementById('ai-prompt-input'),
                generateAiBtn: document.getElementById('generate-ai-btn'),
                micBtn: document.getElementById('mic-btn'),
                promptSpeakerBtn: document.getElementById('prompt-speaker-btn'),
                ttsInput: document.getElementById('tts-input'),
                playBtn: document.getElementById('play-btn'),
                playIcon: document.getElementById('play-icon'),
                playText: document.getElementById('play-text'),
                stopBtn: document.getElementById('stop-btn'),
                statusDisplay: document.getElementById('tts-status'),
                transcriptLine: document.getElementById('transcript-line'),
                voiceSelect: document.getElementById('voice-select'),
                langSelect: document.getElementById('lang-select'),
                lexiconSelect: document.getElementById('lexicon-select'),
                lexiconInjectBtn: document.getElementById('lexicon-inject-btn'),
                modeSelect: document.getElementById('mode-select'),
                pixarMouth: document.getElementById('pixar-mouth-open'),
                femaleMouth: document.getElementById('female-mouth-open'),
                statusDot: document.getElementById('status-dot'),
                statusText: document.getElementById('status-text'),
                ocularNerveBtn: document.getElementById('ocular-nerve-btn'),
                ocrScanBtn: document.getElementById('ocr-scan-btn'),
                moodScanBtn: document.getElementById('mood-scan-btn'),
                ocularVideo: document.getElementById('ocular-video-element'),
                ocularCanvas: document.getElementById('ocular-canvas-element'),
                tetraGamingArea: document.getElementById('tetra-gaming-area'),
                avatarCard: document.getElementById('avatar-gesture-card')
            };

            if (dom.langSelect) dom.langSelect.value = activeLang;

            function runSystemDiagnostics() {
                console.log("=== OMNISTACK TIER 1 DIAGNOSTICS ===");
                console.log("Math.js Engine:", typeof math !== 'undefined' ? "ONLINE ✓" : "OFFLINE ✗");
                console.log("Compromise NLP:", typeof window.nlp !== 'undefined' ? "ONLINE ✓" : "OFFLINE ✗");
                console.log("Tesseract OCR:", typeof Tesseract !== 'undefined' ? "ONLINE ✓" : "OFFLINE ✗");
                console.log("Face-API Biometrics:", typeof faceapi !== 'undefined' ? "ONLINE ✓" : "OFFLINE ✗");
                console.log("Local History Vault:", typeof JAI_HISTORY_VAULT !== 'undefined' ? `ONLINE ✓ (${JAI_HISTORY_VAULT.length} entries)` : "OFFLINE ✗");
                console.log("====================================");
            }
            runSystemDiagnostics();

            const updateNetworkBadge = () => {
                if (navigator.onLine) {
                    if (dom.statusDot) dom.statusDot.style.backgroundColor = '#10b981';
                    if (dom.statusText) dom.statusText.innerText = "Engine Online";
                } else {
                    if (dom.statusDot) dom.statusDot.style.backgroundColor = '#f59e0b';
                    if (dom.statusText) dom.statusText.innerText = "Offline Vault Active";
                }
            };
            window.addEventListener('online', updateNetworkBadge);
            window.addEventListener('offline', updateNetworkBadge);
            updateNetworkBadge();

            // ==========================================
            // OCULAR NERVE CAMERA BASE64 CAPTURE ENGINE
            // ==========================================
            async function triggerOcularNerveBase64Capture() {
                if (!dom.transcriptLine) return;
                dom.transcriptLine.innerText = `"Activating Ocular Nerve visual feed..."`;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    dom.ocularVideo.srcObject = stream;
                    await dom.ocularVideo.play();

                    setTimeout(() => {
                        const width = dom.ocularVideo.videoWidth || 640;
                        const height = dom.ocularVideo.videoHeight || 480;
                        dom.ocularCanvas.width = width;
                        dom.ocularCanvas.height = height;

                        const ctx = dom.ocularCanvas.getContext('2d');
                        ctx.drawImage(dom.ocularVideo, 0, 0, width, height);

                        currentOcularBase64 = dom.ocularCanvas.toDataURL('image/jpeg', 0.85);
                        stream.getTracks().forEach(track => track.stop());

                        console.log("Ocular Base64 Payload Captured. Length:", currentOcularBase64.length);
                        dom.transcriptLine.innerText = `"Ocular feed captured in Base64 (${width}x${height}). Visual context ready."`;
                        
                        if (dom.aiPromptInput && !dom.aiPromptInput.value) {
                            dom.aiPromptInput.value = "[Visual Base64 Feed Attached] Analyze this frame.";
                        }
                        // AUTONOMOUS PAYLOAD DISPATCH: Auto-click Generate button after capture
                        setTimeout(() => dom.generateAiBtn.click(), 500);
                    }, 300);
                } catch (err) {
                    console.error("Ocular Camera Error:", err);
                    dom.transcriptLine.innerText = `"Camera feed unavailable or permission denied."`;
                }
            }

            if (dom.ocularNerveBtn) {
                dom.ocularNerveBtn.addEventListener('click', triggerOcularNerveBase64Capture);
            }

            // ==========================================
            // OCR SCANNER (TESSERACT.JS)
            // ==========================================
            async function triggerOCRScan() {
                if (!dom.transcriptLine) return;
                dom.transcriptLine.innerText = `"Activating OCR Scanner. Please hold document to camera..."`;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    dom.ocularVideo.srcObject = stream;
                    await dom.ocularVideo.play();

                    setTimeout(async () => {
                        const ctx = dom.ocularCanvas.getContext('2d');
                        dom.ocularCanvas.width = dom.ocularVideo.videoWidth;
                        dom.ocularCanvas.height = dom.ocularVideo.videoHeight;
                        ctx.drawImage(dom.ocularVideo, 0, 0);
                        stream.getTracks().forEach(track => track.stop());

                        dom.transcriptLine.innerText = `"Extracting text via local OCR..."`;
                        const result = await Tesseract.recognize(dom.ocularCanvas, 'eng');
                        
                        if (result.data.text.trim()) {
                            dom.aiPromptInput.value = result.data.text.trim();
                            dom.transcriptLine.innerText = `"Text successfully extracted and injected."`;
                        } else {
                            dom.transcriptLine.innerText = `"No text detected in frame."`;
                        }
                    }, 800);
                } catch (err) {
                    console.error(err);
                    dom.transcriptLine.innerText = `"Camera feed unavailable."`;
                }
            }

            if (dom.ocrScanBtn) {
                dom.ocrScanBtn.addEventListener('click', triggerOCRScan);
            }

            // ==========================================
            // BIOMETRIC MOOD SCANNER (FACE-API.JS)
            // ==========================================
            async function triggerBiometricScan() {
                if (!dom.transcriptLine) return;
                dom.transcriptLine.innerText = `"Scanning biometric telemetry..."`;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    dom.ocularVideo.srcObject = stream;
                    await dom.ocularVideo.play();

                    setTimeout(async () => {
                        const detection = await faceapi.detectSingleFace(dom.ocularVideo, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
                        stream.getTracks().forEach(track => track.stop());

                        if (detection) {
                            const expressions = detection.expressions;
                            const dominantMood = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);

                            dom.transcriptLine.innerText = `"Biometric scan complete. Mood detected: ${dominantMood.toUpperCase()}"`;

                            // Adjust operation mode based on expression
                            if (['happy', 'surprised'].includes(dominantMood)) {
                                dom.modeSelect.value = "Short & Punchy";
                            } else {
                                dom.modeSelect.value = "Genius-Philosopher";
                            }
                        } else {
                            dom.transcriptLine.innerText = `"No face detected. Retaining current mode."`;
                        }
                    }, 800);
                } catch (err) {
                    console.error(err);
                    dom.transcriptLine.innerText = `"Camera feed unavailable."`;
                }
            }

            if (dom.moodScanBtn) {
                dom.moodScanBtn.addEventListener('click', triggerBiometricScan);
            }

            // ==========================================
            // UPGRADED WAVY EQ VISUALIZER
            // ==========================================
            const runVisualizer = (isSpeaking) => {
                const bars = document.querySelectorAll('.eq-bar');
                if (!isSpeaking) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                    bars.forEach(bar => bar.style.transform = 'scaleY(1)');
                    if (dom.pixarMouth) dom.pixarMouth.style.opacity = '0';
                    if (dom.femaleMouth) dom.femaleMouth.style.opacity = '0';
                    return;
                }

                // The Bell Curve Array: Outer edges barely move, Center pulses heavily
                const waveWeights = [0.15, 0.3, 0.6, 0.9, 1.3, 1.6, 1.6, 1.3, 0.9, 0.6, 0.3, 0.15];

                function renderFrame() {
                    const simulatedVolume = Math.random();
                    
                    bars.forEach((bar, index) => {
                        const weight = waveWeights[index] || 1;
                        const magnitude = ((Math.random() * 0.8) * weight) + (simulatedVolume * weight) + 1;
                        bar.style.transform = `scaleY(${magnitude})`;
                    });

                    const isMouthOpen = simulatedVolume > 0.45;
                    if (dom.pixarMouth) dom.pixarMouth.style.opacity = isMouthOpen ? '1' : '0';
                    if (dom.femaleMouth) dom.femaleMouth.style.opacity = isMouthOpen ? '1' : '0';

                    animationFrameId = requestAnimationFrame(renderFrame);
                }
                renderFrame();
            };

            const antiGravityLanguageDetect = (text) => {
                if (!text || isLanguageLocked) return;
                if (/[\u0900-\u097F]/.test(text)) dom.langSelect.value = 'hi';
                else if (/[áéíóúñ¿¡]/i.test(text)) dom.langSelect.value = 'es';
                else dom.langSelect.value = 'en';
                
                activeLang = dom.langSelect.value;
                updateVoiceList();
            };

            // ==========================================
            // WEB SPEECH STT RECOGNITION
            // ==========================================
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition && dom.micBtn) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
               
                recognition.onstart = () => {
                    isRecording = true;
                    dom.micBtn.classList.add('mic-active');
                    dom.aiPromptInput.placeholder = "Listening... Speak now.";
                    dom.transcriptLine.innerText = '"Audio channel open. Transcribing..."';
                    runVisualizer(true);
                };
               
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    dom.aiPromptInput.value = dom.aiPromptInput.value ? dom.aiPromptInput.value + " " + transcript : transcript;
                    dom.transcriptLine.innerText = `"${transcript}"`;
                };
               
                recognition.onerror = (event) => {
                    console.error("Speech Error:", event.error);
                    dom.transcriptLine.innerText = '"Microphone error. Check permissions."';
                };
               
                recognition.onend = () => {
                    isRecording = false;
                    dom.micBtn.classList.remove('mic-active');
                    runVisualizer(false);
                    if(!dom.aiPromptInput.value.trim()) {
                        dom.aiPromptInput.placeholder = "Ask Jai (Math, History, Lexicon, Dictionary)...";
                    }
                };

                dom.micBtn.addEventListener('click', () => {
                    if (isRecording) {
                        recognition.stop();
                    } else {
                        recognition.lang = dom.langSelect.value === 'la' ? 'it-IT' : dom.langSelect.value;
                        recognition.start();
                    }
                });
            } else if (dom.micBtn) {
                dom.micBtn.style.display = 'none';
            }

            if (dom.promptSpeakerBtn) {
                dom.promptSpeakerBtn.addEventListener('click', () => {
                    const textToRead = dom.aiPromptInput.value.trim();
                    if (!textToRead) return;
                    dom.ttsInput.value = textToRead;
                    antiGravityLanguageDetect(textToRead);
                    setTimeout(() => dom.playBtn.click(), 200);
                });
            }

            function updateVoiceList() {
                if (!window.speechSynthesis) return;
                allSystemVoices = window.speechSynthesis.getVoices();
                if (allSystemVoices.length === 0 || !dom.voiceSelect) return;
               
                let searchPrefix = activeLang === 'la' ? 'it' : (activeLang === 'nah' ? 'es' : activeLang);
                let filteredVoices = allSystemVoices.filter(v => v.lang.startsWith(searchPrefix));
               
                dom.voiceSelect.innerHTML = '';
                if (filteredVoices.length === 0) {
                    dom.voiceSelect.innerHTML = '<option value="">Default System Voice</option>';
                    return;
                }

                let selectedIndex = 0;
                let primaryFound = false;

                filteredVoices.forEach((voice, index) => {
                    const opt = document.createElement('option');
                    opt.value = allSystemVoices.indexOf(voice);
                    const cleanName = voice.name.replace(/Microsoft |Google /g, '');
                    opt.textContent = `${cleanName} (${voice.lang})`;
                   
                    const vName = voice.name.toLowerCase();
                    if (activeLang === 'en' && !primaryFound) {
                        if (vName.includes('dave') || vName.includes('david')) {
                            selectedIndex = index;
                            primaryFound = true;
                        } else if (vName.includes('zira') || vName.includes('jenny') || vName.includes('aria') || (vName.includes('female') && vName.includes('us'))) {
                            selectedIndex = index;
                        } else if (!primaryFound && (vName.includes('daniel') || vName.includes('uk'))) {
                            selectedIndex = index;
                        }
                    }
                    dom.voiceSelect.appendChild(opt);
                });
               
                dom.voiceSelect.selectedIndex = selectedIndex;
            }

            if (dom.langSelect) {
                dom.langSelect.addEventListener('change', () => {
                    activeLang = dom.langSelect.value;
                    isLanguageLocked = true;
                    if (dom.transcriptLine) dom.transcriptLine.innerText = `"Acoustic profile locked to ${activeLang.toUpperCase()}."`;
                    updateVoiceList();
                });
            }

            updateVoiceList();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = updateVoiceList;
            }

            function breakTextIntoChunks(text, max = 220) {
                let cleanText = text.replace(/[*#]/g, '');
                const sentences = cleanText.match(/[^.!?;\n]+[.!?;\n]+/g) || [cleanText];
                let chunks = [], current = "";
                for (let s of sentences) {
                    if ((current + s).length > max) {
                        if (current) chunks.push(current.trim());
                        current = s;
                    } else {
                        current += " " + s;
                    }
                }
                if (current) chunks.push(current.trim());
                return chunks.filter(c => c.length > 2);
            }

            function createUtterance(text) {
                const u = new SpeechSynthesisUtterance(text);
                const voiceIndex = dom.voiceSelect ? dom.voiceSelect.value : "";
               
                if (allSystemVoices.length && voiceIndex !== "") {
                    u.voice = allSystemVoices[voiceIndex];
                }
                u.lang = u.voice ? u.voice.lang : (activeLang === 'la' ? 'it-IT' : (activeLang === 'nah' ? 'es-MX' : activeLang));
                u.rate = parseFloat(document.getElementById('rate').value || 0.96);
                u.pitch = parseFloat(document.getElementById('pitch').value || 1.0);
                u.volume = parseFloat(document.getElementById('volume').value || 1.0);
                return u;
            }

            function updateUIState(state) {
                ttsState = state;
                if (state === 'playing') {
                    dom.playIcon.innerText = "⏸";
                    dom.playText.innerText = "Pause Sync";
                    dom.statusDisplay.innerText = "TRANSMITTING";
                    dom.statusDisplay.className = "text-[10px] font-bold text-teal-400 uppercase animate-pulse";
                    runVisualizer(true);
                } else if (state === 'paused') {
                    dom.playIcon.innerText = "▶";
                    dom.playText.innerText = "Resume Sync";
                    dom.statusDisplay.innerText = "PAUSED";
                    dom.statusDisplay.className = "text-[10px] font-bold text-amber-500 uppercase";
                    runVisualizer(false);
                } else if (state === 'thinking') {
                    dom.statusDisplay.innerHTML = '<div class="thinking-spinner"></div> THINKING';
                    dom.statusDisplay.className = "text-[10px] font-bold text-indigo-400 uppercase flex items-center";
                } else {
                    dom.playIcon.innerText = "▶";
                    dom.playText.innerText = "Initialize";
                    dom.statusDisplay.innerText = "IDLE";
                    dom.statusDisplay.className = "text-[10px] font-bold text-slate-400 uppercase tracking-widest";
                    runVisualizer(false);
                }
            }

            function triggerAvatarLipSync(isSpeaking) {
                const activeAvatar = document.querySelector('.skin-layer.active');
                if (activeAvatar) {
                    activeAvatar.classList.toggle('speaking', isSpeaking);
                }
            }

            // ==========================================
            // UPGRADED CHUNKING ENGINE (EVENT LOOP BRIDGE)
            // ==========================================
            function processChunks() {
                if (currentChunks.length === 0) {
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                    
                    // ==========================================
                    // THE EVENT LOOP BRIDGE (Subsystem #8)
                    // Auto-handoff back to the STT microphone
                    // ==========================================
                    setTimeout(() => {
                        if (!isRecording && (window.SpeechRecognition || window.webkitSpeechRecognition) && dom.micBtn) {
                            console.log("Autonomy Engine: Re-opening audio channel...");
                            dom.micBtn.click(); 
                        }
                    }, 800);
                    
                    return;
                }
               
                const text = currentChunks.shift();
                currentUtterance = createUtterance(text);
               
                currentUtterance.onstart = () => triggerAvatarLipSync(true);
                currentUtterance.onpause = () => triggerAvatarLipSync(false);
                currentUtterance.onresume = () => triggerAvatarLipSync(true);

                currentUtterance.onend = () => {
                    if (ttsState === 'playing') {
                        processChunks();
                    } else {
                        triggerAvatarLipSync(false);
                    }
                };
               
                currentUtterance.onerror = (e) => {
                    console.error("TTS Error:", e);
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                };
                speechSynthesis.speak(currentUtterance);
            }

            if (dom.playBtn) {
                dom.playBtn.addEventListener('click', () => {
                    if (ttsState === 'playing') {
                        speechSynthesis.pause();
                        updateUIState('paused');
                        return;
                    }
                   
                    if (ttsState === 'paused') {
                        speechSynthesis.resume();
                        updateUIState('playing');
                        return;
                    }
                    const text = dom.ttsInput.value.trim();
                    if (!text) return;
                    speechSynthesis.cancel();
                    currentChunks = breakTextIntoChunks(text);
                    if(currentChunks.length === 0) return;
                    updateUIState('playing');
                    processChunks();
                });
            }

            if (dom.stopBtn) {
                dom.stopBtn.addEventListener('click', () => {
                    speechSynthesis.cancel();
                    updateUIState('idle');
                    triggerAvatarLipSync(false);
                });
            }

            if (dom.lexiconInjectBtn && dom.lexiconSelect) {
                dom.lexiconInjectBtn.addEventListener('click', () => {
                    const selectedTerm = dom.lexiconSelect.value;
                    if(selectedTerm) {
                        dom.ttsInput.value = dom.ttsInput.value ? dom.ttsInput.value + "\n\n" + selectedTerm : selectedTerm;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Lexicon term injected into acoustic buffer."`;
                       
                        dom.lexiconInjectBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                        dom.lexiconInjectBtn.innerText = "INJECTED ✓";
                        setTimeout(() => {
                            dom.lexiconInjectBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
                            dom.lexiconInjectBtn.innerText = "Inject to Prompter";
                        }, 1500);
                    }
                });
            }

            function generateDynamicOfflineResponse(prompt, mode) {
                let subject = "your query";
                if (window.nlp) {
                    const nouns = window.nlp(prompt).nouns().out('array');
                    if (nouns.length > 0) subject = nouns[0];
                }
                const responses = {
                    "Short & Punchy": `Local Sovereign Engine: Evaluated "${subject}". All parameters valid.`,
                    "Genius-Philosopher": `Pondering "${subject}" through sovereign logic reveals an interconnected structure of local thought.`,
                    "Comedic Roast": `Offline mode active. Asking about "${subject}"? My local logic core is on it!`,
                    "cloud": `Offline Failsafe: Synthesized local context for "${subject}".`
                };
                return responses[mode] || responses.cloud;
            }

            if (dom.generateAiBtn) {
                dom.generateAiBtn.addEventListener('click', async () => {
                    const prompt = dom.aiPromptInput.value.trim();
                    if (!prompt) return;
                    
                    dom.generateAiBtn.disabled = true;
                    runVisualizer(true);
                    const activeMode = dom.modeSelect ? dom.modeSelect.value : "cloud";

                    const defMatch = prompt.toLowerCase().match(/(?:define|definition of|what does|meaning of|jai lexicon)\s+([a-z\s-]+)/i);
                    if (defMatch && defMatch[1]) {
                        const wordToLookup = defMatch[1].trim();
                        const dictResult = await resolveDictionaryQuery(wordToLookup);
                        dom.ttsInput.value = dictResult;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Hybrid Dictionary Resolution Completed."`;
                        antiGravityLanguageDetect(dictResult);
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                        setTimeout(() => dom.playBtn.click(), 200);
                        return;
                    }

                    const offlineResponse = processTier1Offline(prompt);
                    if (offlineResponse) {
                        dom.ttsInput.value = offlineResponse;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Local Sovereign Vault match found. Routing to TTS."`;
                        antiGravityLanguageDetect(offlineResponse);
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                        setTimeout(() => dom.playBtn.click(), 200);
                        return;
                    }

                    if (!navigator.onLine || activeMode !== "cloud") {
                        const localResponse = generateDynamicOfflineResponse(prompt, activeMode);
                        dom.ttsInput.value = localResponse;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Offline compute engaged. Bypassing cloud API."`;
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                        setTimeout(() => dom.playBtn.click(), 200);
                        return;
                    }

                    if (dom.transcriptLine) dom.transcriptLine.innerText = `"Consulting Cognitive Core..."`;
                    updateUIState('thinking');

                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 8000);

                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: prompt,
                                mode: activeMode,
                                model: JAI_CONFIG.MODEL,
                                imageBase64: currentOcularBase64
                            }),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);

                        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                        const data = await response.json();

                        if (data.text) {
                            dom.ttsInput.value = data.text;
                            antiGravityLanguageDetect(data.text);
                            if (dom.transcriptLine) dom.transcriptLine.innerText = `"Cloud response secured. Synthesizing voice."`;
                            updateUIState('idle');
                            setTimeout(() => dom.playBtn.click(), 200);
                        }
                    } catch (error) {
                        console.warn("Cloud API unreachable or throttled. Routing to local synthesis.", error);
                        const fallbackMsg = generateDynamicOfflineResponse(prompt, "cloud");
                        dom.ttsInput.value = fallbackMsg;
                        if (dom.transcriptLine) dom.transcriptLine.innerText = `"Cloud link offline (500/timeout). Synthesizing local fallback."`;
                        updateUIState('idle');
                        setTimeout(() => dom.playBtn.click(), 200);
                    } finally {
                        dom.generateAiBtn.disabled = false;
                        runVisualizer(false);
                    }
                });
            }

            ['rate','pitch','volume'].forEach(id => {
                const slider = document.getElementById(id);
                const val = document.getElementById(id + '-val');
                if (slider && val) {
                    slider.addEventListener('input', () => val.textContent = parseFloat(slider.value).toFixed(2));
                }
            });
        });
    </script>
</body>
</html>

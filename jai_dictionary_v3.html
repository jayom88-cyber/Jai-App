<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JAI Digital Assistant (v3.0) — Core UI & Hybrid Dictionary Integration</title>
    <!-- Tier 2 Offline Fallback Library -->
    <script src="https://unpkg.com/compromise"></script>

    <style>
        /* Glassmorphic UI & Core Resets */
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-active: #2563eb;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--accent-color);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        button:active {
            background: var(--accent-active);
            transform: scale(0.98);
        }

        #output-panel {
            min-height: 120px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            font-size: 1rem;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
            width: fit-content;
        }

        .badge-local { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-cloud { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-offline { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-error { background: rgba(239, 68, 68, 0.2); color: var(--error-color); }
        
        /* Loader Animation */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>JAI Digital Assistant (v3.0)</h1>
            <p class="subtitle">Hybrid OmniStack Dictionary & Core UI</p>
        </header>

        <div class="input-group">
            <input type="text" id="word-input" placeholder="Enter a word to define..." autocomplete="off" autocorrect="off" autocapitalize="none">
            <button id="search-btn">Search Definitions</button>
        </div>

        <div id="output-panel">
            <span style="color: var(--text-muted); text-align: center;">System standing by...</span>
        </div>
    </div>

    <script>
        // =====================================================================
        // JAI DIGITAL ASSISTANT v3.0: HYBRID DICTIONARY ROUTING LOGIC & UI
        // =====================================================================

        // Tier 1: Local Vault (Core English + Jai-Verse Lexicon)
        window.localDictionary = {
            "resilience": "The capacity to withstand or to recover quickly from difficulties; toughness.",
            "algorithm": "A process or set of rules to be followed in calculations or other problem-solving operations, especially by a computer.",
            "bandwidth": "The energy or mental capacity required to deal with a situation.",
            "aeroscribe": "A conceptual framework for drawing or rendering logic seamlessly through the air or digital space.",
            "somastack": "A multi-layered architectural approach to structuring both physical and digital workflows.",
            "harmonode": "A central convergence point where varying digital or musical signals synthesize into a unified frequency.",
            "syntaxometry": "The precise measurement and structural alignment of language, code, and geometry.",
            "trembulous": "Characterized by a high-frequency, vibrating energetic state bordering on breakthrough."
        };

        const inputField = document.getElementById('word-input');
        const searchBtn = document.getElementById('search-btn');
        const outputPanel = document.getElementById('output-panel');

        const renderState = (type, message) => {
            let badgeClass = '';
            let badgeText = '';

            switch(type) {
                case 'local': badgeClass = 'badge-local'; badgeText = 'Tier 1: Local Vault'; break;
                case 'cloud': badgeClass = 'badge-cloud'; badgeText = 'Tier 3: Cloud API'; break;
                case 'offline': badgeClass = 'badge-offline'; badgeText = 'Tier 2: NLP Fallback'; break;
                case 'error': badgeClass = 'badge-error'; badgeText = 'System Error'; break;
                case 'loading':
                    outputPanel.innerHTML = '<div class="loader"></div>';
                    return;
            }

            outputPanel.innerHTML = `
                <div class="status-badge ${badgeClass}">${badgeText}</div>
                <div>${message}</div>
            `;
        };

        async function handleDictionaryLookup(queryWord) {
            const word = queryWord.toLowerCase().trim();
            if (!word) {
                renderState('error', 'Please enter a valid word.');
                return;
            }

            renderState('loading');

            // 1. PRIMARY: Check Local Vault (Instant - Zero Latency)
            if (window.localDictionary && window.localDictionary[word]) {
                console.log(`[OmniStack] Word found in Local Vault.`);
                setTimeout(() => renderState('local', window.localDictionary[word]), 150);
                return;
            }

            // 2. OFFLINE FALLBACK: Compromise.js Word-Root Analysis
            if (!navigator.onLine) {
                console.warn(`[OmniStack] Offline mode active. Utilizing compromise.js fallback for: ${word}`);
                
                if (typeof window.nlp !== 'undefined') {
                    let doc = window.nlp(word);
                    let root = doc.verbs().out('array')[0] || doc.nouns().out('array')[0] || word;
                    renderState('offline', `Offline Analysis: The term '<strong>${word}</strong>' is currently unavailable in the core vault, but it appears structurally related to '<strong>${root}</strong>'.`);
                } else {
                    renderState('error', "System offline: Word not found in local vault and NLP engine unavailable.");
                }
                return;
            }

            // 3. ONLINE FALLBACK: Public Dictionary API
            try {
                console.log(`[OmniStack] Fetching obscure word from external Dictionary API...`);
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                
                if (!response.ok) {
                    throw new Error(`Cloud API unreachable or word undefined (Status: ${response.status})`);
                }
                
                const data = await response.json();
                const definition = data[0]?.meanings[0]?.definitions[0]?.definition;
                
                if (definition) {
                    renderState('cloud', definition);
                } else {
                    renderState('error', `Definition for '${word}' not found in the external database.`);
                }
                
            } catch (error) {
                console.error("[OmniStack] API Fallback Error:", error);
                renderState('error', `Network error or word not found while retrieving external definition for '${word}'.`);
            }
        }

        // Event Listeners for Mobile & Desktop Parity
        if (searchBtn && inputField) {
            searchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleDictionaryLookup(inputField.value);
                inputField.blur();
            });

            // Touchstart listener for instantaneous mobile response
            searchBtn.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                handleDictionaryLookup(inputField.value);
                inputField.blur();
            }, { passive: false });

            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleDictionaryLookup(inputField.value);
                    inputField.blur();
                }
            });
        }
    </script>
</body>
</html>
